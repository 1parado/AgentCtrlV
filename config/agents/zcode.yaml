id: zcode
launch: 'C:\Program Files\ZCode\ZCode.exe'
name: "ZCode"
type: gui
enabled: true
process: "ZCode.exe"
window:
  title_pattern: "ZCode*"
  multi_instance: "recent"
locate:
  method: "blind"   # uia/click 尚未实现；写了会被警告且不生效
inject:
  method: "clipboard"
  paste_delay: 300
  render_delay: 500
  auto_enter: false
permissions: "normal"
supported_payloads: ["image", "text"]
icon: "assets/agents/zcode.png"