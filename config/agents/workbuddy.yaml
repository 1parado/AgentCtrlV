id: workbuddy
launch: 'C:\Program Files\WorkBuddy\WorkBuddy.exe'
name: "WorkBuddy"
type: gui
enabled: true
process: "WorkBuddy.exe"
window:
  title_pattern: "WorkBuddy*"
  multi_instance: "recent"
locate:
  method: "blind"   # uia/click 尚未实现；写了会被警告且不生效
inject:
  method: "clipboard"
  paste_delay: 300
  render_delay: 500
  auto_enter: false
permissions: "normal"
supported_payloads: ["image", "text"]
icon: "assets/agents/workbuddy.png"