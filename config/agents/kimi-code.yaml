id: kimi-code
launch: 'C:\Program Files\Kimi Code\Kimi Code.exe'
name: "Kimi Code"
type: gui
enabled: true
process: "Kimi Code.exe"
window:
  title_pattern: "Kimi Code*"
  multi_instance: "recent"
locate:
  method: "uia"
  uia_control: "EditControl"
  uia_timeout: 1000
inject:
  method: "clipboard"
  paste_delay: 300
  render_delay: 500
  auto_enter: false
permissions: "normal"
supported_payloads: ["image", "text"]
icon: "assets/agents/kimi-code.png"