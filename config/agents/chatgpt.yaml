id: chatgpt-desktop
name: "ChatGPT"
type: gui
enabled: true
process: "ChatGPT.exe"
launch: "shell:AppsFolder\\OpenAI.ChatGPT-Desktop_2p2nqsd0c76g0!ChatGPT"
window:
  title_pattern: "ChatGPT*"
  multi_instance: "recent"
locate:
  method: "uia"
  uia_control: "DocumentControl"
  uia_search_depth: 10
  uia_timeout: 1000
  click_coords: [960, 800]
inject:
  method: "clipboard"
  paste_delay: 300
  render_delay: 500
  auto_enter: false
cold_start:
  new_session: true
  new_session_method: "hotkey"
  new_session_hotkey: "Ctrl+N"
  ready_timeout: 8000
  ui_ready_timeout: 3000
hot_start:
  reuse_session: true
  clear_input: false
permissions: "normal"
supported_payloads: ["image", "text"]
icon: "assets/icons/chatgpt.png"
