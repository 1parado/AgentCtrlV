id: chatgpt-desktop
name: "ChatGPT"
type: gui
enabled: false   # 本机未安装；装上后改成 true 即可进菜单
process: "ChatGPT.exe"
launch: "shell:AppsFolder\\OpenAI.ChatGPT-Desktop_2p2nqsd0c76g0!ChatGPT"
window:
  title_pattern: "ChatGPT*"
  multi_instance: "recent"
locate:
  method: "blind"   # uia/click 尚未实现；写了会被警告且不生效
inject:
  method: "clipboard"
  paste_delay: 300
  render_delay: 500
  auto_enter: false
