id: cursor
name: "Cursor"
type: gui
enabled: true
process: "Cursor.exe"
launch: ""
window:
  title_pattern: "Cursor*"
  multi_instance: "recent"
locate:
  method: "uia"
  uia_control: "EditControl"
  uia_search_depth: 12
  uia_timeout: 1000
inject:
  method: "clipboard"
  paste_delay: 300
  render_delay: 500
  auto_enter: false
cold_start:
  new_session: false
  new_session_method: "none"
  ready_timeout: 8000
  ui_ready_timeout: 3000
hot_start:
  reuse_session: true
  clear_input: false
permissions: "normal"
supported_payloads: ["image", "text"]
icon: "assets/icons/cursor.png"
