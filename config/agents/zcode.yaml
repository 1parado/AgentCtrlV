id: zcode
launch: 'C:\Program Files\ZCode\ZCode.exe'
name: "ZCode"
type: gui
enabled: true
process: "ZCode.exe"
window:
  title_pattern: "ZCode*"
  multi_instance: "recent"
locate:
  method: "uia"
  uia_control: "EditControl"
  uia_timeout: 1000
inject:
  method: "clipboard"
  paste_delay: 300
  render_delay: 500
  auto_enter: false
permissions: "normal"
supported_payloads: ["image", "text"]
icon: "assets/agents/zcode.png"