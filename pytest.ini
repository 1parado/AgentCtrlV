[pytest]
testpaths = tests
pythonpath = .
# 默认排除 integration：它们会真实改写剪贴板、抢焦点、开关记事本，
# 不能污染 `pytest tests/` 这个文档化的日常命令。显式跑：pytest -m integration
addopts = -q --strict-markers -m "not integration"
markers =
    integration: touches the real Windows clipboard or real windows; opt in with -m integration
